name: Build app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CameraCoach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CameraCoach-apk
          path: CameraCoach.apk

      # Phone-friendly download: always the newest build at .../releases/latest
      - name: Publish to "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build CameraCoach.apk \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap CameraCoach.apk to install. Built from ${{ github.sha }} on ${{ github.ref_name }}." \
            --target ${{ github.sha }} \
            --latest
